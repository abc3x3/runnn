<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>跑步紀錄系統</title>
  
  <!-- 1. 雙重跳轉保險：如果 JS 失效，5秒後自動強制刷新到 GAS -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzkNTA-kAYdcXjDUlrq7PIcdXDKUPQK5ocbUCFxWt6FXrusAgf2tOPXAUOqSBboWH14rw/exec
">

  <!-- 2. iOS 圖示設定 (請確認檔案名真的是 icon.png) -->
  <link rel="apple-touch-icon" href="runnnn.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 100px; color: #666; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #20c997; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    a { color: #20c997; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p>正在進入跑步系統...</p>
  <!-- 如果跳轉失敗，使用者可以手動點擊 -->
  <a href="https://script.google.com/macros/s/AKfycbzkNTA-kAYdcXjDUlrq7PIcdXDKUPQK5ocbUCFxWt6FXrusAgf2tOPXAUOqSBboWH14rw/exec
">點此手動開啟</a>

  <script>
    // 3. JavaScript 跳轉
    window.location.href = "https://script.google.com/macros/s/AKfycbzkNTA-kAYdcXjDUlrq7PIcdXDKUPQK5ocbUCFxWt6FXrusAgf2tOPXAUOqSBboWH14rw/exec
";
  </script>
</body>
</html>
